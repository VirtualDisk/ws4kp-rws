server {
    listen 8080;
    server_name localhost;
    include mime.types;
    types {
        text/javascript mjs;
    }

    root /usr/share/nginx/html;

    add_header X-Weatherstar true always;

    include /etc/nginx/includes/wsqs_redirect.conf;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location /music/ {
        autoindex on;
    }

    # mis.nyiso.com sends no CORS headers, so the browser can't fetch it directly like it can
    # api.weather.gov; proxy it same-origin so the NYISO grid screens work in static deployments.
    location /nyiso/ {
        proxy_ssl_server_name on;
        proxy_set_header Host mis.nyiso.com;
        proxy_pass https://mis.nyiso.com/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
